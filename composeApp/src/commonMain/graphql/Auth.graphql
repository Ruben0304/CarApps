mutation Login($username: String!, $password: String!) {
    login(input: {username: $username, password: $password}) {
        token
        user {
            id
            username
            phone
            fullName
        }
    }
}

mutation Register($username: String!, $password: String!, $phone: String!, $fullName: String!) {
    register(input: {username: $username, password: $password, phone: $phone, fullName: $fullName}) {
        token
        user {
            id
            username
            phone
            fullName
        }
    }
}